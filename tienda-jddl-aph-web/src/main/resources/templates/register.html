<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Jugador12</title>

    <!-- Bootstrap CSS (mismo CDN que ya usas en el admin) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Hoja de estilos pública del sitio -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-dark text-white">

<!-- Cabecera pública de la tienda -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card border-secondary bg-dark">
                <div class="card-body p-4 p-md-5">

                    <h1 class="h3 mb-4 text-center text-white">
                        <i class="bi bi-person-plus me-2 text-primary"></i>Crear cuenta
                    </h1>

                    <!-- Mensaje de error (mismo patrón que en admin) -->
                    <div th:if="${error}"
                         class="alert alert-danger d-flex align-items-center mb-4"
                         role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!--
                        Formulario de registro.
                        - th:action: Thymeleaf inserta el token CSRF automáticamente.
                        - th:object: vincula el formulario al DTO "registro" del modelo.
                        - method="post": el envío va a POST /register.
                    -->
                    <form th:action="@{/register}"
                          th:object="${registro}"
                          method="post">

                        <div class="mb-3">
                            <label for="email" class="form-label text-white">
                                Email <span class="text-danger">*</span>
                            </label>
                            <input type="email" id="email"
                                   th:field="*{email}"
                                   class="form-control bg-dark text-white border-secondary"
                                   placeholder="tucorreo@ejemplo.com"
                                   required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label text-white">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="nombre"
                                       th:field="*{nombre}"
                                       class="form-control bg-dark text-white border-secondary"
                                       placeholder="Tu nombre"
                                       required>
                            </div>
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label text-white">
                                    Apellidos <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="apellidos"
                                       th:field="*{apellidos}"
                                       class="form-control bg-dark text-white border-secondary"
                                       placeholder="Tus apellidos"
                                       required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="telefono" class="form-label text-white">
                                    Teléfono <span class="text-white-50 small">(opcional)</span>
                                </label>
                                <input type="tel" id="telefono"
                                       th:field="*{telefono}"
                                       class="form-control bg-dark text-white border-secondary"
                                       placeholder="+34 600 000 000">
                            </div>
                            <div class="col-md-6">
                                <label for="fechaNacimiento" class="form-label text-white">
                                    Fecha de nacimiento <span class="text-white-50 small">(opcional)</span>
                                </label>
                                <input type="date" id="fechaNacimiento"
                                       th:field="*{fechaNacimiento}"
                                       class="form-control bg-dark text-white border-secondary">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label text-white">
                                Contraseña <span class="text-danger">*</span>
                            </label>
                            <input type="password" id="password"
                                   th:field="*{password}"
                                   class="form-control bg-dark text-white border-secondary"
                                   placeholder="Elige una contraseña segura"
                                   required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" id="aceptaCondiciones"
                                   th:field="*{aceptaCondiciones}"
                                   class="form-check-input">
                            <label for="aceptaCondiciones" class="form-check-label text-white">
                                He leído y acepto las
                                <a th:href="@{/condiciones}"
                                   class="text-primary"
                                   target="_blank"
                                   rel="noopener">condiciones de uso</a>
                                <span class="text-danger">*</span>
                            </label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-person-check me-1"></i>Registrarme
                            </button>
                        </div>

                    </form>

                    <hr class="border-secondary my-4">

                    <p class="text-center text-white-50 mb-0 small">
                        ¿Ya tienes cuenta?
                        <a th:href="@{/login}" class="text-primary">Inicia sesión</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</main>
</body>
</html>
